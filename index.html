<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MTD Tracker</title>
<meta name="description" content="Making Tax Digital records for UK sole traders and landlords: money in and out, quarterly update totals, tax estimate and deadlines. Works offline, data stays on your device.">
<meta name="theme-color" content="#2F5D4C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>:root{--page:#F5F4EF;--card:#FFFFFF;--text:#22302A;--muted:#5C6A63;--line:#E3DFD6;--band:#477563;--bandt:#FFFFFF;--input:#F2F5F2;--accent:#2F5D4C;--accon:#FFFFFF;--brass:#A27B2C;--brasst:#7C5D1E;--tint:#F5ECD8;--ok:#2F5D4C;--oktint:#E3EFE9;--warn:#7A4A12;--warntint:#F8E7CA;--bad:#B3261E;--badtint:#FCE8E6;--waittint:#ECE9E2;--hero:#2F5D4C;--herot:#FFFFFF;--heroacc:#E9CF8F;--c-in:#477563;--c-out:#C9C2B2;--c-plan:#E3DFD6;--shadow:0 1px 2px rgba(30,40,35,.05),0 2px 10px rgba(30,40,35,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#121614;--card:#1B211E;--text:#EDF1EE;--muted:#A5B0AA;--line:#2C332F;--band:#26352F;--bandt:#EDF1EE;--input:#222A26;--accent:#8FC0AA;--accon:#121614;--brass:#D9B76A;--brasst:#E3C684;--tint:#3A3220;--ok:#A9C7BB;--oktint:#1F3A30;--warn:#F5B47A;--warntint:#3E2A16;--bad:#F28B82;--badtint:#3A2422;--waittint:#232A26;--hero:#22382F;--herot:#EDF1EE;--heroacc:#D9B76A;--c-in:#6F9C89;--c-out:#4A534E;--c-plan:#2C332F;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--page:#121614;--card:#1B211E;--text:#EDF1EE;--muted:#A5B0AA;--line:#2C332F;--band:#26352F;--bandt:#EDF1EE;--input:#222A26;--accent:#8FC0AA;--accon:#121614;--brass:#D9B76A;--brasst:#E3C684;--tint:#3A3220;--ok:#A9C7BB;--oktint:#1F3A30;--warn:#F5B47A;--warntint:#3E2A16;--bad:#F28B82;--badtint:#3A2422;--waittint:#232A26;--hero:#22382F;--herot:#EDF1EE;--heroacc:#D9B76A;--c-in:#6F9C89;--c-out:#4A534E;--c-plan:#2C332F;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
.app{max-width:760px;margin:0 auto;padding:0 16px calc(90px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--page);padding:14px 0 10px;display:flex;align-items:center;gap:10px}
header.top h1{font:700 22px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;flex:1;letter-spacing:-.2px}
.brand{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.brand svg{width:16px;height:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 0 10px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .lnk{margin-left:auto;text-transform:none;letter-spacing:0;font-size:13px;color:var(--accent);background:none;border:0;cursor:pointer;font-weight:600;padding:4px 0}
.hero{background:var(--hero);color:var(--herot);border-radius:18px;padding:20px 18px;margin:0 0 12px;position:relative;overflow:hidden}
.hero .n{font:700 46px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-1px}
.hero .l{font-size:15px;opacity:.92;margin-top:4px}
.hero .who{font:600 18px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin-top:14px}
.hero .w{font-size:14px;opacity:.88}
.hero svg.leaf{position:absolute;right:-10px;top:-6px;width:150px;height:150px;opacity:.18}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad{background:var(--badtint);border-color:var(--bad)}.kpi.bad .v{color:var(--bad)}
.kpi.warn{background:var(--warntint);border-color:var(--warn)}.kpi.warn .v{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;min-height:50px}
.row:first-of-type,h2+.row,.gh+.row{border-top:0}
.row .main{flex:1;min-width:0}.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.row .amt small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.row.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.tick{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.tick svg{width:16px;height:16px;stroke:var(--accon);fill:none;stroke-width:3;opacity:0}
.tick.on{background:var(--band);border-color:var(--band)}.tick.on svg{opacity:1;stroke:#fff}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--oktint);color:var(--ok)}.pill.warn{background:var(--warntint);color:var(--warn)}
.pill.bad{background:var(--badtint);color:var(--bad)}.pill.wait{background:var(--waittint);color:var(--muted)}
.pill.rose{background:var(--tint);color:var(--accent)}
.btn{border:0;border-radius:999px;padding:12px 18px;min-height:46px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accon)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.plain{background:var(--waittint);color:var(--text)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.small{min-height:38px;padding:8px 14px;font-size:14px}
.btn.block{width:100%}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1;min-width:130px}
.fab{position:fixed;right:max(16px,calc(50vw - 364px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:11;
border:0;border-radius:999px;padding:14px 20px;background:var(--accent);color:var(--accon);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer;min-height:50px}
.seg{display:flex;background:var(--waittint);border-radius:999px;padding:4px;margin:0 0 12px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:9px 10px;min-height:40px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;min-height:38px;white-space:nowrap;cursor:pointer;font-size:14px}
.chips button.on{background:var(--accent);color:var(--accon);border-color:var(--accent);font-weight:600}
label.f{display:block;margin:0 0 12px;min-width:0}label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);background:var(--input);border-radius:10px;padding:11px 12px;min-height:46px;outline:none;min-width:0}
textarea.i{min-height:70px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--tint)}
.search{position:relative;margin-bottom:10px}.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:13px;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,14,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--page);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:6px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .bar{position:sticky;top:0;background:var(--page);display:flex;align-items:center;gap:8px;padding:10px 0;z-index:2}
.sheet .bar h3{flex:1;margin:0;font:700 18px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:var(--waittint);border-radius:999px;width:40px;height:40px;font-size:20px;cursor:pointer;flex:none}
.break{font-variant-numeric:tabular-nums}.break div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line)}
.break div:first-child{border-top:0}.break .big{font-size:17px;font-weight:700;border-top:1px solid var(--line)}
.break div>span:last-child,.break div>b{white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:13px}.right{text-align:right}.mono{font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:18px 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--text);color:var(--page);padding:10px 16px;border-radius:999px;z-index:30;font-size:14px;max-width:90vw;text-align:center}
.welcome{text-align:center;padding:26px 10px}.welcome h2{text-transform:none;font:700 22px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);letter-spacing:0;display:block}
.welcome svg{width:64px;height:64px;margin-bottom:6px}
.warnbox{background:var(--warntint);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.badbox{background:var(--badtint);color:var(--bad);border-radius:12px;padding:11px 13px;font-size:14px;margin-bottom:12px;cursor:pointer;font-weight:600}
.okbox{background:var(--oktint);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.check{display:flex;align-items:center;gap:10px;margin:0 0 12px;min-height:44px}.check input{width:22px;height:22px;accent-color:var(--accent)}
/* charts */
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{width:120px;height:120px;flex:none}.ring text{fill:var(--text)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:14px;flex:1;min-width:0}
.legend.h{flex-direction:row;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:8px}.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;flex:none}
.sbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--c-plan);margin:8px 0 4px}
.sbar b{display:block;height:100%}
.meter{height:8px;border-radius:999px;background:var(--waittint);overflow:hidden;margin:6px 0}.meter b{display:block;height:100%;background:var(--band)}
.cbar{position:relative;height:8px;border-radius:999px;background:var(--c-plan);margin-top:6px;overflow:hidden}
.cbar b{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.cbar b.c{background:var(--c-comm)}.cbar b.p{background:var(--c-paid)}.cbar b.o{background:var(--bad)}

.hero .acc{color:var(--heroacc)}
.hero .row2{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}.hero .row2 div{font-size:13px;opacity:.9}.hero .row2 b{display:block;font-size:18px;opacity:1}
.brass{color:var(--brasst)}
.qgrid{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(0,1fr));gap:6px;align-items:center;font-size:13px}
.qgrid .h{font-size:12px;color:var(--muted);font-weight:700;text-align:center}.qgrid .h:first-child{text-align:left}
.qgrid .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qgrid .pill{font-size:11px;padding:2px 6px;display:block;text-align:center;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;margin-top:6px}
.bars .m{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;min-width:0}
.bars .pair{display:flex;gap:2px;align-items:flex-end;width:100%;height:100%;justify-content:center}
.bars .pair b{display:block;width:45%;border-radius:3px 3px 0 0;min-height:1px}
.bars .m i{font-style:normal;font-size:10px;color:var(--muted);margin-top:3px}
.hbar{margin:8px 0}.hbar .lab{display:flex;justify-content:space-between;font-size:13px;gap:8px}.hbar .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{height:9px;border-radius:999px;background:var(--waittint);margin-top:3px;overflow:hidden}.hbar .tr b{display:block;height:100%;background:var(--brass);border-radius:999px}
.amt.in{color:var(--ok)}
.qline{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.qline:first-of-type{border-top:0}.qline .c{flex:1;min-width:0}.qline .v{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.qline.zero .v,.qline.zero .c{color:var(--muted);font-weight:400}
.cp{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;min-height:32px;color:var(--accent);font-weight:600}
.qtot{display:flex;justify-content:space-between;padding:8px 0;border-top:1.5px solid var(--line);font-weight:700}
.io{display:flex;background:var(--waittint);border-radius:999px;padding:4px;margin-bottom:12px}
.io button{flex:1;border:0;background:none;border-radius:999px;padding:10px;min-height:44px;font-weight:700;color:var(--muted);cursor:pointer}
.io button.on.in{background:var(--ok);color:var(--card)}.io button.on.out{background:var(--brass);color:#fff}
.bigamt{font-size:30px!important;font-weight:700;text-align:center;min-height:62px!important}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--line)}
.rimg{max-width:100%;border-radius:10px;border:1px solid var(--line);margin:6px 0 10px;display:block}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.banner{background:var(--tint);color:var(--brasst);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
@media print{body *{visibility:hidden}}
.tour{text-align:center;animation:rise .4s ease-out}.tour .tico svg{width:60px;height:60px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tour h2{margin:6px 0 4px}.tour p{max-width:420px;margin:0 auto 10px;min-height:66px}
.dots{display:flex;justify-content:center;gap:8px;margin:8px 0 10px}
.dots button{width:9px;height:9px;padding:0;border-radius:999px;border:0;background:var(--line);cursor:pointer;transition:width .2s}
.dots button.on{width:24px;background:var(--accent)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

:root{--page:#EFF1EC;--ink:#1D2B24;--text:#1D2B24;--line:#D6DAD2;--rule:#C7CCC3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#111613;--ink:#EEF2EE;--rule:#38423C}}
html,body{font-family:"Public Sans",system-ui,sans-serif}
header.top h1,.big,.ledger h2,.card h2,.qtot,.seg-q b{font-family:"Bricolage",system-ui,sans-serif}
header.top h1{font-weight:700;letter-spacing:-.01em}
.card h2{text-transform:none;letter-spacing:0;font-size:17px;color:var(--text);font-weight:600}
.card{box-shadow:none;border-radius:10px}
.yr{padding:6px 2px 4px;margin:0 0 18px}
.yr .big{font-size:84px;line-height:.9;font-weight:700;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
.yr .big span{font-size:30px;letter-spacing:0;color:var(--text);margin-left:4px}
.yr .lead{font-size:17px;line-height:1.4;margin:10px 0 18px;max-width:30ch}
.ribbon{position:relative;padding-top:4px}
.track{display:flex;gap:3px;height:58px}
.seg-q{border:0;border-radius:4px;padding:8px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-width:0;color:var(--text);background:var(--waittint)}
.seg-q b{font-size:17px;font-weight:700}.seg-q span{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-q.sent{background:var(--accent);color:var(--accon)}
.seg-q.now{background:var(--brass);color:#fff}
.seg-q.late{background:var(--bad);color:#fff}
.seg-q.later{background:transparent;border:1.5px dashed var(--rule)}
.pin{position:absolute;top:-4px;bottom:-22px;width:0}
.pin i{position:absolute;left:-1px;top:0;bottom:16px;border-left:2px solid var(--ink)}
.pin span{position:absolute;bottom:0;left:0;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap}
.months{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:26px;padding:0 2px}
.ledger{margin:0 0 18px;border-top:2px solid var(--ink)}
.ledger h2{font-size:18px;font-weight:600;margin:10px 0 2px}
.lrow{display:flex;align-items:baseline;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:16px}
.lrow span small{display:block;font-size:12.5px;color:var(--muted)}
.lrow i{flex:1;border-bottom:1.5px dotted var(--rule);transform:translateY(-4px)}
.lrow b{font-variant-numeric:tabular-nums;font-weight:600}
.lrow b.in{color:var(--accent)}
.lrow.big b{font-family:"Bricolage",sans-serif;font-size:30px;font-weight:700;letter-spacing:-.01em}
.lrow b.acc{color:var(--brasst)}
.lrow.total{border-bottom:3px double var(--ink)}.lrow.total b{font-weight:700}
.note-r{font-size:14px;line-height:1.45;padding:12px 14px;border-left:4px solid var(--brass);background:var(--card);margin:0 0 18px;cursor:pointer}
.note-r u{color:var(--accent);font-weight:600;text-underline-offset:3px}
/* quarters as a ledger */
.qline{border-top:0;border-bottom:1px solid var(--line);padding:9px 0;gap:6px}
.qline .v{font-variant-numeric:tabular-nums;font-weight:600}
.qline .cp{width:36px;height:36px;border-radius:8px;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;border:1.5px solid var(--line)}
.qline .cp svg{width:17px;height:17px;fill:none;stroke:var(--accent);stroke-width:2}
.qline .cp:active{background:var(--oktint)}
.qtot{font-size:17px}
.seg-q,.seg-q *{text-decoration:none!important}
.pin{top:62px;bottom:-22px}.pin i{top:0;bottom:16px}
.pin i:before{content:"";position:absolute;left:-6px;top:-1px;border:5px solid transparent;border-bottom:7px solid var(--ink);border-top:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg-q.now{color:#1D2B24}:root:not([data-theme="light"]) .seg-q.sent{color:#111613}}
/* v2 month chart */
.chart-note{margin:-4px 0 12px;font-size:14px;color:var(--muted)}.chart-note b{color:var(--text)}
.bars2{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:22px}
.m2{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:stretch}
.m2 .col{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:1.5px solid var(--ink)}
.m2 .col b{display:block;width:100%}
.m2 .col b.k{background:var(--accent);border-radius:3px 3px 0 0}
.m2 .col b.s{background:var(--c-out)}
.m2 .col em{position:absolute;left:50%;transform:translateX(-50%);top:-20px;font-style:normal;font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap}
.m2.fut .col{border-bottom-style:dashed;border-bottom-color:var(--rule)}
.m2 i{font-style:normal;font-size:10px;color:var(--muted);text-align:center;margin-top:5px}
.m2.now i{color:var(--text);font-weight:700}
.key{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:10px}
.key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.key i.k{background:var(--accent)}.key i.s{background:var(--c-out)}

/* ===== v3: wedding-style home, own MTD look ===== */
.hero2{--heroacc:#E9CF8F;position:relative;overflow:hidden;color:#fff;border-radius:24px;padding:20px 18px 20px;margin:0 0 14px;display:flex;align-items:center;gap:16px;
background:radial-gradient(380px 240px at 88% 0%,rgba(255,255,255,.14),transparent 70%),linear-gradient(140deg,color-mix(in srgb,var(--hero) 94%,#fff),color-mix(in srgb,var(--hero) 72%,#000));
box-shadow:0 12px 30px color-mix(in srgb,var(--hero) 32%,transparent);border:1px solid rgba(255,255,255,.1)}
.hero2.late{--heroacc:#F4A39B}
.hero2 .papers{position:absolute;right:-22px;top:-18px;width:190px;height:190px;opacity:.2;pointer-events:none}
.hero2 .papers .seal{stroke:var(--heroacc)}
.hero2 .cd{position:relative;flex:none;width:136px;height:136px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero2 .cring{position:absolute;inset:0;width:136px;height:136px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.2))}
.hero2 .n{position:relative;font:700 48px/1 "Bricolage",system-ui,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero2 .l{position:relative;font-size:12.5px;opacity:.9;margin-top:3px}
.hero2 .cw{position:relative;min-width:0}
.hero2 .who{font:600 20px/1.2 "Bricolage",system-ui,sans-serif}
.hero2 .w{font-size:14px;line-height:1.4;opacity:.88;margin-top:4px}
.hero2 .hbtn{margin-top:12px;border:0;border-radius:999px;background:#fff;color:color-mix(in srgb,var(--hero) 85%,#000);font-weight:700;font-size:14px;padding:9px 14px;cursor:pointer}
.yrcard .ribbon{margin-top:2px}.yrcard .months{margin-top:24px}
.pot{display:flex;gap:14px;align-items:center;cursor:pointer;background:linear-gradient(160deg,var(--tint),var(--card) 70%)}
.pot .jar{width:84px;height:106px;flex:none}
.pot .pl{font-size:13.5px;color:var(--muted)}
.pot .amt{font:700 34px/1.05 "Bricolage",system-ui,sans-serif;color:var(--brasst);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.pot p{margin:6px 0 0;font-size:14px;line-height:1.4}
.pot .pay{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 12px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;min-width:0}
.tile .ti{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;background:var(--oktint);margin-bottom:8px}
.tile .ti svg{width:17px;height:17px;fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile .l{font-size:12.5px;color:var(--muted)}
.tile .v{font:700 22px/1.15 "Bricolage",system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--muted)}
.tile.acc{background:var(--tint);border-color:transparent}.tile.acc .ti{background:var(--brass)}.tile.acc .ti svg{stroke:#fff}.tile.acc .v{color:var(--brasst)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sw{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px 6px 6px;font-size:13.5px;cursor:pointer}
.sw i{width:22px;height:22px;border-radius:50%;background:var(--c)}
.sw.on{border-color:var(--text);font-weight:700}
/* motion: one entrance, plus feedback on "I sent it today" */
.enter .hero2 .pg{animation:draw 1.2s cubic-bezier(.2,.7,.2,1)}
@keyframes draw{from{stroke-dasharray:0 400}}
.enter .hero2 .dot{animation:fadein .4s 1s both}
@keyframes fadein{from{opacity:0}}
.enter .hero2 .p1{animation:drift 1.6s cubic-bezier(.2,.7,.2,1) both}
.enter .hero2 .p2{animation:drift 1.6s .12s cubic-bezier(.2,.7,.2,1) both}
.enter .hero2 .seal{animation:sealpop .6s 1.1s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes drift{from{transform:translate(18px,-14px) rotate(6deg);opacity:0}}
@keyframes sealpop{from{transform:scale(0)}}
.pot .jcoin>*{transform-box:fill-box}

<script>/* MTD Tracker app: the math. A plain port of build/model.py compute(), checked by test.js against expected.json

(function (root) {
  "use strict";
  var SE = "Self-employment", UKP = "UK property", FP = "Foreign property";
  var CATS = [
    ["Turnover", SE, "In", 1], ["Other business income", SE, "In", 1], ["Cost of goods bought for resale", SE, "Out", 1],
    ["CIS payments to subcontractors", SE, "Out", 1], ["Wages, salaries and staff costs", SE, "Out", 1],
    ["Car, van and travel expenses", SE, "Out", 1], ["Rent, rates, power and insurance", SE, "Out", 1],
    ["Repairs and maintenance", SE, "Out", 1], ["Phone, stationery and office costs", SE, "Out", 1], ["Advertising", SE, "Out", 1],
    ["Business entertainment", SE, "Out", 0], ["Interest on bank and other loans", SE, "Out", 1],
    ["Bank, credit card and finance charges", SE, "Out", 1], ["Accountancy, legal and professional fees", SE, "Out", 1],
    ["Other business expenses", SE, "Out", 1],
    ["Total rent", UKP, "In", 1], ["Other income from property", UKP, "In", 1], ["Premiums for the grant of a lease", UKP, "In", 1],
    ["Reverse premiums and inducements", UKP, "In", 1], ["Rent, rates, insurance and ground rents", UKP, "Out", 1],
    ["Property repairs and maintenance", UKP, "Out", 1], ["Non-residential property finance costs", UKP, "Out", 1],
    ["Residential property finance costs", UKP, "Out", 0], ["Legal, management and professional fees", UKP, "Out", 1],
    ["Costs of services provided, incl. wages", UKP, "Out", 1], ["Travel expenses (property)", UKP, "Out", 1],
    ["Other allowable property expenses", UKP, "Out", 1],
    ["Foreign rents and other receipts", FP, "In", 1], ["Foreign premiums for the grant of a lease", FP, "In", 1],
    ["Foreign allowable property expenses", FP, "Out", 1]];
  var CAT = {}; CATS.forEach(function (c) { CAT[c[0]] = c; });
  var FINANCE = "Residential property finance costs", ENTERTAIN = "Business entertainment";
  var MILE_CAT = {}; MILE_CAT[SE] = "Car, van and travel expenses"; MILE_CAT[UKP] = "Travel expenses (property)";
  MILE_CAT[FP] = "Foreign allowable property expenses";
  var BIG = 100000000;
  var RATES = {
    "2026/27": { pa: 12570, taper: 100000, ruk_tops: [37700, 125140, BIG], ruk: [0.20, 0.40, 0.45], prop: [0.20, 0.40, 0.45], fin: 0.20,
      sco_tops: [3967, 16956, 31092, 62430, 125140, BIG], sco: [0.19, 0.20, 0.21, 0.42, 0.45, 0.48],
      c4_lo: 12570, c4_hi: 50270, c4_main: 0.06, c4_top: 0.02, mile1: 0.45, mile2: 0.25, mile_cap: 10000, allowance: 1000 },
    "2027/28": { pa: 12570, taper: 100000, ruk_tops: [37700, 125140, BIG], ruk: [0.20, 0.40, 0.45], prop: [0.22, 0.42, 0.47], fin: 0.22,
      sco_tops: [3967, 16956, 31092, 62430, 125140, BIG], sco: [0.19, 0.20, 0.21, 0.42, 0.45, 0.48],
      c4_lo: 12570, c4_hi: 50270, c4_main: 0.06, c4_top: 0.02, mile1: 0.45, mile2: 0.25, mile_cap: 10000, allowance: 1000 }
  };
  var YEARS = ["2026/27", "2027/28"], UPDATES = ["Q1", "Q2", "Q3", "Q4"];
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  function d2n(iso) { var p = String(iso).split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5; }
  function n2d(n) { return new Date(Math.round(n) * 864e5).toISOString().slice(0, 10); }
  function ymd(y, m, d) { return Date.UTC(y, m - 1, d) / 864e5; }             // month may overflow, like DATE()

  function catsOf(t) { return CATS.filter(function (c) { return c[1] === t; }).map(function (c) { return c[0]; }); }
  function plural(n) { return n === 1 ? " day" : " days"; }

  function period(set) {
    var y = +String(set.year || YEARS[0]).slice(0, 4), cal = String(set.qtype || "").indexOf("Calendar") === 0;
    var st = ymd(y, 4, cal ? 1 : 6);
    var ends = [1, 2, 3, 4].map(function (q) { var d = new Date(st * 864e5); return ymd(d.getUTCFullYear(), d.getUTCMonth() + 1 + 3 * q, d.getUTCDate()) - 1; });
    var dues = [ymd(y, 8, 7), ymd(y, 11, 7), ymd(y + 1, 2, 7), ymd(y + 1, 5, 7)];
    return { y: y, st: st, en: ends[3], ends: ends, dues: dues };
  }
  function fixedDeadlines(set) {
    var y = period(set).y;
    return [["Payment on account 1", ymd(y + 1, 1, 31)], ["Payment on account 2", ymd(y + 1, 7, 31)],
      ["Tax return and balancing payment", ymd(y + 2, 1, 31)]];
  }
  function suggest(rules, desc) {
    var k = -1, d = String(desc || "").toLowerCase();
    rules.forEach(function (r, i) { if (r.kw && d.indexOf(String(r.kw).toLowerCase()) >= 0) k = i; });
    return k;
  }
  function recordRows(S) {
    var P = period(S.settings), bmap = {}, names = [];
    S.businesses.forEach(function (b) { if (b.name && !(b.name in bmap)) { bmap[b.name] = b; names.push(b.name); } });
    return S.records.map(function (r) {
      var k = suggest(S.rules, r.desc), rule = k >= 0 ? S.rules[k] : null;
      var bus = r.bus || (rule && rule.bus ? rule.bus : (names.length === 1 ? names[0] : ""));
      var cat = r.cat || (rule ? rule.cat || "" : "");
      var use = r.use == null || r.use === "" ? 1 : r.use, chk = "OK";
      if (!r.date) chk = "Check: date";
      else if (typeof r.amount !== "number" || !r.amount) chk = "Check: amount";
      else if (!(bus in bmap)) chk = "Check: pick a business";
      else if (!cat) chk = "Check: pick a category";
      else if (!CAT[cat]) chk = "Check: category";
      else if (CAT[cat][1] !== bmap[bus].type) chk = "Check: category is for " + CAT[cat][1];
      else if (!(use >= 0 && use <= 1)) chk = "Check: business use %";
      var o = { id: r.id, date: r.date, bus: bus, cat: cat, check: chk, dir: "", allow: 0, upd: "" };
      if (chk === "OK") {
        var d = d2n(r.date);
        o.dir = CAT[cat][2]; o.allow = r2(Math.abs(r.amount) * use);
        o.upd = d < P.st || d > P.en ? "Other year" : "Q" + (1 + P.ends.slice(0, 3).filter(function (e) { return d > e; }).length);
      }
      return o;
    });
  }
  function mileAllow(miles, R) { return r2(R.mile1 * Math.min(miles, R.mile_cap) + R.mile2 * Math.max(0, miles - R.mile_cap)); }
  function tripOk(t, S) { return t.date && t.miles > 0 && S.businesses.some(function (b) { return b.name && b.name === t.bus; }); }
  function ytd(S, rows, b, upto) {
    var P = period(S.settings), R = RATES[S.settings.year] || RATES[YEARS[0]], tot = {};
    catsOf(b.type).forEach(function (c) { tot[c] = 0; });
    rows.forEach(function (r) { var d; if (r.check === "OK" && r.bus === b.name) { d = d2n(r.date); if (d >= P.st && d <= upto) tot[r.cat] += r.allow; } });
    var miles = 0;
    S.trips.forEach(function (t) { var d; if (tripOk(t, S) && t.bus === b.name) { d = d2n(t.date); if (d >= P.st && d <= upto) miles += t.miles; } });
    if (b.mile === "Yes" && MILE_CAT[b.type]) tot[MILE_CAT[b.type]] += mileAllow(miles, R);
    var inc = 0, exp = 0;
    Object.keys(tot).forEach(function (k) { tot[k] = r2(tot[k]); if (CAT[k][2] === "In") inc += tot[k]; else exp += tot[k]; });
    return { cats: tot, income: r2(inc), expenses: r2(exp), profit: r2(inc - exp), miles: miles };
  }
  function bandTax(x, tops, rates) {
    var t = 0, lo = 0;
    for (var i = 0; i < tops.length; i++) { if (x > lo) t += (Math.min(x, tops[i]) - lo) * rates[i]; lo = tops[i]; }
    return t;
  }
  function incomeTax(set, nonprop, prop) {
    var R = RATES[set.year] || RATES[YEARS[0]], total = nonprop + prop;
    var pa = Math.max(0, R.pa - Math.max(0, (total - R.taper) / 2));
    var n = Math.max(0, nonprop - pa), p = Math.max(0, prop - Math.max(0, pa - nonprop));
    if (set.region === "Scotland") return bandTax(n + p, R.sco_tops, R.sco);
    return bandTax(n, R.ruk_tops, R.ruk) + bandTax(n + p, R.ruk_tops, R.prop) - bandTax(n, R.ruk_tops, R.prop);
  }
  function estimate(S, totals, factor) {
    var set = S.settings, R = RATES[set.year] || RATES[YEARS[0]], se = 0, prop = 0, fin = 0, lines = [];
    S.businesses.forEach(function (b) {
      if (!b.name || !totals[b.name]) return;
      var t = totals[b.name], inc = t.income * factor, exp = 0;
      Object.keys(t.cats).forEach(function (k) { if (CAT[k][2] === "Out" && CAT[k][3]) exp += t.cats[k]; });
      exp *= factor;
      if (b.allow === "Yes") exp = Math.min(inc, R.allowance);
      var prof = Math.max(0, inc - exp);
      if (b.type === SE) se += prof; else prop += prof;
      if (b.type === UKP) fin += t.cats[FINANCE] * factor;
      lines.push({ name: b.name, income: inc, costs: exp, profit: prof });
    });
    var other = set.other || 0;
    var taxAll = incomeTax(set, other + se, prop), taxOther = incomeTax(set, other, 0);
    var credit = R.fin * Math.min(fin, prop), it = Math.max(0, taxAll - taxOther - credit);
    var c4 = R.c4_main * Math.max(0, Math.min(se, R.c4_hi) - R.c4_lo) + R.c4_top * Math.max(0, se - R.c4_hi);
    var total = it + c4, pa = Math.max(0, R.pa - Math.max(0, (other + se + prop - R.taper) / 2));
    return { se: r2(se), prop: r2(prop), fin: r2(fin), credit: r2(credit), it: r2(it), c4: r2(c4), total: r2(total), lines: lines,
      poa: total > 1000 ? r2(total / 2) : 0, pa: r2(pa), month: r2(total / 12), other: other };
  }
  function pillDeadline(sent, due, asof, soon, word) {
    if (sent) { var s = d2n(sent), dt = new Date(s * 864e5); return "✓ " + (word || "Sent") + " " + dt.getUTCDate() + " " + MON[dt.getUTCMonth()]; }
    var n;
    if (due < asof) { n = asof - due; return "▲ Late " + n + plural(n); }
    if (due === asof) return "● Due today";
    n = due - asof;
    return (n <= soon ? "● " : "") + "Due in " + n + plural(n);
  }

  function compute(S, asofIso) {
    var set = S.settings, asof = d2n(asofIso), soon = typeof set.soon === "number" ? set.soon : 30;
    var P = period(set), rows = recordRows(S), upd = UPDATES.indexOf(S.update || "Q1");
    if (upd < 0) upd = 0;
    var buses = S.businesses.filter(function (b) { return b.name; });
    var year = {}, at = {}, prev = {};
    buses.forEach(function (b) {
      year[b.name] = ytd(S, rows, b, P.en);
      at[b.name] = UPDATES.map(function (u, q) { return ytd(S, rows, b, P.ends[q]); });
    });
    var sent = S.sent || {}, paid = S.paid || {};
    var dl = [];
    buses.forEach(function (b) {
      UPDATES.forEach(function (u, i) {
        var s = sent[b.name + "|" + u] || null;
        dl.push({ bus: b.name, upd: u, q: i, start: n2d(P.st), end: n2d(P.ends[i]), due: n2d(P.dues[i]), sent: s,
          pill: pillDeadline(s, P.dues[i], asof, soon) });
      });
    });
    var fixed = fixedDeadlines(set).map(function (f) {
      var p = paid[f[0]] || null;
      return { what: f[0], due: n2d(f[1]), paid: p, pill: pillDeadline(p, f[1], asof, soon, "Done") };
    });
    var pts = 0;
    if (set.year !== "2026/27") {
      for (var i = 0; i < 4; i++) {
        var late = buses.some(function (b) { var s = sent[b.name + "|" + UPDATES[i]]; return s ? d2n(s) > P.dues[i] : asof > P.dues[i]; });
        if (late) pts++;
      }
    }
    var openU = dl.filter(function (d) { return !d.sent; }).sort(function (a, b) { return d2n(a.due) - d2n(b.due); });
    var openP = fixed.filter(function (f) { return !f.paid; });
    var daysIn = P.en - P.st + 1, elapsed = Math.max(0, Math.min(asof - P.st + 1, daysIn)), factor = elapsed ? daysIn / elapsed : 0;
    var estNow = estimate(S, year, 1), estFull = elapsed ? estimate(S, year, factor) : null;
    var inc = 0, exp = 0, miles = 0;
    Object.keys(year).forEach(function (k) { inc += year[k].income; exp += year[k].expenses; miles += year[k].miles; });
    var receipts = 0, checks = 0, recs = 0;
    var rec = {}; S.records.forEach(function (r) { rec[r.id] = r; });
    rows.forEach(function (r) {
      if (r.check.indexOf("Check") === 0) checks++;
      if (r.check === "OK" && r.upd && r.upd !== "Other year") {
        recs++;
        if (r.dir === "Out" && rec[r.id].receipt !== "Yes") receipts++;
      }
    });
    S.trips.forEach(function (t) { if (!tripOk(t, S) && (t.date || t.miles || t.bus)) checks++; });
    var bycat = {};
    Object.keys(year).forEach(function (k) { var c = year[k].cats; Object.keys(c).forEach(function (x) {
      if (CAT[x][2] === "Out" && c[x]) bycat[x] = r2((bycat[x] || 0) + c[x]); }); });
    var months = [];
    for (var m = 0; m < 12; m++) {
      var a = Math.max(P.st, ymd(P.y, 4 + m, 1)), z = Math.min(P.en, ymd(P.y, 5 + m, 0)), mi = 0, mo = 0;
      rows.forEach(function (r) { if (r.check !== "OK") return; var d = d2n(r.date); if (d >= a && d <= z) { if (r.dir === "In") mi += r.allow; else mo += r.allow; } });
      months.push({ m: MON[(3 + m) % 12], income: r2(mi), costs: r2(mo) });
    }
    return { rows: rows, period: { start: n2d(P.st), end: n2d(P.en), ends: P.ends.map(n2d), dues: P.dues.map(n2d) },
      year: year, at: at, deadlines: dl, fixed: fixed, points: pts, nextUpdate: openU[0] || null, nextPay: openP[0] || null,
      estNow: estNow, estFull: estFull, factor: factor, elapsed: elapsed, daysIn: daysIn,
      income: r2(inc), expenses: r2(exp), profit: r2(inc - exp), miles: miles, receipts: receipts, checks: checks, records: recs,
      bycat: bycat, months: months };
  }
  function needMtd(rows) {
    return rows.map(function (r) {
      if (r.se == null && r.prop == null) return null;
      var q = (r.se || 0) + (r.prop || 0), lim = { 2024: 50000, 2025: 30000, 2026: 20000 }[r.y];
      return { q: q, yes: q > lim, from: "6 April " + (r.y + 2), limit: lim };
    });
  }
  /* partner/device sync: newest edit wins (field u), deletions kept as tombstones */
  var LISTS = ["businesses", "rules", "records", "trips"];
  function merge(A, B) {
    var out = JSON.parse(JSON.stringify(A)), added = 0, updated = 0, removed = 0;
    out.tomb = Object.assign({}, A.tomb || {});
    Object.keys(B.tomb || {}).forEach(function (k) { if (!out.tomb[k] || B.tomb[k] > out.tomb[k]) out.tomb[k] = B.tomb[k]; });
    LISTS.forEach(function (k) {
      var mine = {}; (out[k] || []).forEach(function (x) { mine[x.id] = x; });
      (B[k] || []).forEach(function (x) {
        if (out.tomb[x.id] && out.tomb[x.id] >= (x.u || 0)) return;
        if (!mine[x.id]) { mine[x.id] = JSON.parse(JSON.stringify(x)); added++; }
        else if ((x.u || 0) > (mine[x.id].u || 0)) { mine[x.id] = JSON.parse(JSON.stringify(x)); updated++; }
      });
      var list = Object.keys(mine).map(function (id) { return mine[id]; });
      var before = list.length;
      list = list.filter(function (x) { return !(out.tomb[x.id] && out.tomb[x.id] >= (x.u || 0)); });
      removed += before - list.length;
      out[k] = list;
    });
    ["sent", "paid"].forEach(function (k) { out[k] = Object.assign({}, B[k] || {}, A[k] || {}); });
    if ((B.settings && B.settings.u || 0) > (A.settings && A.settings.u || 0)) out.settings = JSON.parse(JSON.stringify(B.settings));

  }

    d2n: d2n, n2d: n2d, CATS: CATS, CAT: CAT, RATES: RATES, YEARS: YEARS, UPDATES: UPDATES, LISTS: LISTS, MILE_CAT: MILE_CAT,
    SE: SE, UKP: UKP, FP: FP, mileAllow: mileAllow, suggest: suggest };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.Calc = api;
})(this);

      fr.readAsDataURL(t.files[0]); t.value = ""; return;
    }
    if (t.id === "bankFile" && t.files[0]) { var br = new FileReader(); br.onload = function () { importBank(String(br.result)); }; br.readAsText(t.files[0]); t.value = ""; return; }
    if ((t.id === "restoreFile" || t.id === "syncFile") && t.files[0]) {
      var r = new FileReader();
      r.onload = function () {
        var st; try { st = JSON.parse(r.result); } catch (err) { st = null; }
        if (!valid(st)) { toast("That file is not an MTD Tracker file."); return; }
        var photos = st.photos; delete st.photos; st = fix(st); delete st.kind;
        if (photos) { Object.assign(PH, photos); savePhotos(); }
        if (t.id === "restoreFile") { st.theme = S.theme; S = st; save(); applyTheme(); render(); toast("Backup restored"); return; }
        var m = C.merge(S, st); S = m.state; save(); render();
        toast(m.added + " added, " + m.updated + " updated" + (m.removed ? ", " + m.removed + " removed" : ""));
      };
      r.readAsText(t.files[0]); t.value = "";
    }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__bip = e; });

  Promise.all([store.get(KEY), store.get(PKEY)]).then(function (v) {
    S = valid(v[0]) ? fix(v[0]) : emptyState(); PH = v[1] || {};
    if (!S.startedAt) S.startedAt = new Date().toISOString();
    applyTheme(); render();
  });
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
